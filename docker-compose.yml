version: "3.9"

services:
  task-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Swap this to a Postgres URL to run against a real database server:
      # - DATABASE_URL=postgresql://taskuser:taskpass@db:5432/taskdb
    volumes:
      # Persists the SQLite file on the host so data survives container restarts.
      - task-data:/app/data
    restart: unless-stopped

  # Uncomment to run against real Postgres instead of SQLite:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=taskuser
  #     - POSTGRES_PASSWORD=taskpass
  #     - POSTGRES_DB=taskdb
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  task-data:
  # pg-data:
